<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Meta Data -->
    <meta
      name="description"
      content="Website game gunting, batu, kertas untuk hiburan dan mengenang masa kecil."
    />
    <meta
      name="keywords"
      content="Gunting Batu Kertas, Rock Paper Scissors, Game"
    />
    <meta name="author" content="Theo Wongkar" />

    <!-- Judul Halaman -->
    <title>Gunting Batu Kertas</title>

    <!-- FavIcon -->
    <link
      rel="shortcut icon"
      href="assets/images/application-logo.png"
      type="image/x-icon"
    />

    <!-- Style -->
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/style.css" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Game <span>Gunting Batu Kertas</span></h1>

      <section>
        <!-- Computer -->
        <div class="computer">
          <h2>Komputer</h2>
          <img src="assets/images/tanda-tanya.png" alt="Komputer" />
        </div>

        <div class="result">
          <p>Hasil</p>
        </div>

        <!-- Player -->
        <div class="player">
          <h2>Klik pilihan kamu!</h2>
          <div>
            <img src="assets/images/Gunting.png" alt="Gunting" />
            <img src="assets/images/batu.png" alt="Batu" />
            <img src="assets/images/Kertas.png" alt="Kertas" />
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
